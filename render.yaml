services:
  - type: web
    name: zygy-voice-aisjhjj
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: EXTENSIONS
        value: "[{\"p\":\"1\",\"k\":\"ai\",\"m\":\"3\",\"g\":\"שלום אני זיגי מה איתך אח בלב?\",\"x\":\"\"},{\"p\":\"2\",\"k\":\"ai\",\"m\":\"1\",\"g\":\"אווווף שוב חזרת לשגע אותי?? דבר זריז למה אין לי כח אליך\",\"x\":\"\"}]"
      - key: MAX_WORDS
        value: "50"
      - key: EXTRA_INSTRUCTION
        value: "אל תתקמצן במילים כשצריך!! יד לך חיבור לאינטרנט! המפתח שלך הוא אדם גאון בשם h.sh"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
